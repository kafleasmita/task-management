<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles/index.css" rel="stylesheet" />
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
      crossorigin="anonymous" 
      referrerpolicy="no-referrer" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" 
    crossorigin="anonymous">
</head>
<body onload="LoadInitialData()">
    <div class="add__new__btn__mobile__only d-md-none">
        <button 
        class="btn btn-primary  d-flex align-items-center gap-2" 
        type="submit"
        data-bs-toggle="modal" 
        data-bs-target="#addNewModal">
        <i class="fas fa-plus" ></i>Add New
      </button>
        
    </div>

    <div 
    class="modal fade" 
    id="addNewModal"
     tabindex="-1" 
     aria-labelledby="exampleModalLabel" 
     aria-hidden="true"
     >
        <div class="modal-dialog  modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fs-5" id="addNewModalLabel">Add New Task</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                    <label for="imageURL" class="form-label">Image Url</label>
                    <input type="url"
                     class="form-control" 
                     id="imageURL"
                      placeholder="http://example.com/image.png"
                    />
                </div>
                <div class="mb-3">
                    <label for="taskTitle" class="form-label">Task Title</label>
                    <input type="text"
                     class="form-control"
                      id="taskTitle"
                       placeholder="Learn Web Dev" required
                       
                    />
                </div>
                <div class="mb-3">
                    <label for="taskType" class="form-label">Task Type</label>
                    <input type="text"
                     class="form-control"
                      id="taskType"
                       placeholder="Work..."
                       required

                    />
                </div>

                <div class="mb-3">
                    <label for="taskDescription" class="form-label">Task Description</label>
                    <textarea
                     type="url"
                     class="form-control"
                      id="taskDescription"
                       placeholder="Explain something about it..."
                       rows="4"
                       required
                       ></textarea>
                </textarea>
                </div>
                <button 
                type="button" 
                class="btn btn-secondary"
                 data-bs-dismiss="modal"
                 >
                 Close
              </button>
                <button type="submit"
                 type="button"
                  class="btn btn-primary" 
                  onclick= "handleSubmit()">
                  Save changes
              </button>
              
              </form>
            </div>
          </div>
        </div>
      </div>



    </div>

    <div class="modal fade"
     id="showTask"
      tabindex="-1" 
      aria-labelledby="showTaskLabel"
       aria-hidden="true"
       >
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="showTaskLabel">Task Details</h5>
              <button 
              type="button" 
              class="btn-close"
               data-bs-dismiss="modal"
                aria-label="Close"
                ></button>
            </div>
            <div class="task__modal__body">
            </div>
            <div class="modal-footer">
              <button
              type="button"
               class="btn btn-secondary"
                data-bs-dismiss="modal"
                >
                Close
            </button>
            </div>
          </div>
        </div>
      </div>
      
      



    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">TaskGhar</a>
          <button class="navbar-toggler"
           type="button"
            data-bs-toggle="collapse" 
            data-bs-target="#navbarSupportedContent" 
            aria-controls="navbarSupportedContent"
             aria-expanded="false" 
             aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                </ul>
            
              <button class="btn btn-primary  d-flex align-items-center gap-2" 
              type="submit"
              data-bs-toggle="modal" 
              data-bs-target="#addNewModal">
              <i class="fas fa-plus" ></i>Add New
            </button>
          </div>
        </div>
      </nav>

      <div class="container">
        <section class="mt-4">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="input-group flex-nowrap shadow-lg rounded">
                        <input type="search" class="form-control" 
                         placeholder="search Task..."
                     aria-describedby="addon-wrapping"
                         />

                         <span class="input-group-text" id="addon-wrapper">
                            <i class="fas fa-search"></i>
                         </span>
                    </div>
                </div>
            </div>
        </section>

        <section class="mt-4">
            <div class="row task__contents">

            </div>
        </section>
      </div>


    <script src ="scripts/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" 
    crossorigin="anonymous"></script>
</body>
</html>
